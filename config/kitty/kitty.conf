# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

#font_family FantasqueSansM Nerd Font Mono Bold
font_family MesloLGS NF
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.99
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 10000000
wheel_scroll_min_lines 1
tab_bar_edge top
tab_bar_style fade
tab_fade 0.25 0.5 0.75 1
tab_bar_min_tabs 2

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

#foreground #00ff00
background #000000
foreground #dddddd
#background #000000
#cursor #dddddd
cursor #00ff00

active_tab_foreground   #000
active_tab_background   #00ff00
active_tab_font_style   bold-italic
inactive_tab_foreground #444
inactive_tab_background #12773d
inactive_tab_font_style normal

